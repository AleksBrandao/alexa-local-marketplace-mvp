services:
  - type: web
    name: aqui-perto-api
    runtime: python
    region: virginia
    plan: free
    rootDir: backend

    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    initialDeployHook: python manage.py loaddata initial_catalog

    healthCheckPath: /api/
    autoDeployTrigger: commit

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"

      - key: DJANGO_DEBUG
        value: "0"

      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1"

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: aqui-perto-db
          property: connectionString

  - type: web
    name: aqui-perto-painel
    runtime: static
    rootDir: frontend

    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit

    envVars:
      - key: VITE_API_URL
        value: https://aqui-perto-api.onrender.com/api

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: aqui-perto-db
    databaseName: aqui_perto
    user: aqui_perto
    region: virginia
    plan: free
